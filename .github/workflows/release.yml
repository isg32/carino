name: Build and release

# Builds signed APKs (one per ABI) on every push to main and publishes them
# as a GitHub release tagged v<version>-<short sha>.
#
# No keystore is committed. It comes from the CARINO_KEYSTORE_BASE64
# secret (`base64 -w0 release-key.jks`), is decoded into the runner's temp
# folder for the build, and android/app/build.gradle.kts reads it through
# the CARINO_* variables, the same way build_signed.sh does locally.
#
# Secrets (in the "deployment" environment): CARINO_KEYSTORE_BASE64,
# CARINO_KEYSTORE_PASSWORD, CARINO_KEY_PASSWORD and, optionally,
# CARINO_KEY_ALIAS (defaults to "upload").

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      # Gradle comes from GitHub's file host, which sometimes times out:
      # keep it (and the dependency cache) between runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Read version and release notes
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          {
            echo 'MESSAGE<<EOM'
            git log -1 --format='%s'
            echo 'EOM'
          } >> "$GITHUB_OUTPUT"
          # This version's section of CHANGELOG.md, if it has one.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true

      - name: Decode the release keystore
        env:
          CARINO_KEYSTORE_BASE64: ${{ secrets.CARINO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CARINO_KEYSTORE_BASE64" ]; then
            echo "CARINO_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          printf '%s' "$CARINO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build signed APKs
        env:
          CARINO_KEYSTORE_FILE: ${{ runner.temp }}/release-key.jks
          CARINO_KEYSTORE_PASSWORD: ${{ secrets.CARINO_KEYSTORE_PASSWORD }}
          CARINO_KEY_PASSWORD: ${{ secrets.CARINO_KEY_PASSWORD }}
          CARINO_KEY_ALIAS: ${{ secrets.CARINO_KEY_ALIAS }}
        # Retried, since the Gradle download can time out on a cold cache.
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi && exit 0
            echo "Build attempt $attempt failed; retrying in 30 s" >&2
            sleep 30
          done
          exit 1

      - name: Check the APKs are signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -q "Android Debug" && { echo "Signed with the debug key" >&2; exit 1; } || true

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.jks"

      - name: Write the release notes
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo '---'
            echo
            echo "**Commit:** ${{ steps.version.outputs.SHA }} · ${{ steps.version.outputs.MESSAGE }}"
            echo
            echo 'For most phones: `app-arm64-v8a-release.apk`.'
          } > "$RUNNER_TEMP/release.md"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}-${{ steps.version.outputs.SHA }}
          name: Cariño ${{ steps.version.outputs.VERSION }}
          body_path: ${{ runner.temp }}/release.md
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
