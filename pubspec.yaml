name: carino
description: "A quiet Android home screen: three tabs, one pill, your wallpaper as the only colour."
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  path_drawing: ^1.0.1
  intl: ^0.20.3
  shared_preferences: ^2.5.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/OFL-Doto.txt
    - assets/fonts/OFL-Inter.txt
    # The mark shown in About, bundled so nothing is fetched.
    - assets/icon/mark.png
    - assets/images/developer.jpg

  shaders:
    - shaders/progressive_blur.frag

  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# App icon: `dart run flutter_launcher_icons` regenerates the Android
# launcher icons from assets/icon/ (adaptive + Android 13 themed icon).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 26
